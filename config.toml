[audio]
device = ""                 # empty = default input device
sample_rate = 16000
min_duration_ms = 300       # ignore shorter taps
max_duration_s = 45
preroll_ms = 200
vad = true

[asr]
model = "nemo-parakeet-tdt-0.6b-v2"
quantization = "int8"
threads = 5                 # leave one core for the OS/UI

[hotkeys]
dictation = "ctrl+alt+d"            # hold to talk
command   = "f10"           # hold to talk
debounce_ms = 50
# Chords work too, e.g. "ctrl+alt+d". Avoid bare Win combos that open Start.

[feedback]
beeps = true
error_flash_s = 3.0

[dictation]
inject = "sendinput"        # "sendinput" | "paste"
paste_threshold_chars = 400
restore_clipboard = true
spoken_tokens = true

[command]
backend = "local"           # "local" | "api" | "rules_only"
confirm_destructive = true
cancel_window_ms = 1500
log_actions = true

[command.local_llm]
server_url = "http://127.0.0.1:8080"
timeout_s = 20

[command.api]
model = "claude-haiku-5-5"
# API key from env var ANTHROPIC_API_KEY, never from the file.

[aliases.sites]
youtube = "youtube.com"
gmail = "mail.google.com"

[aliases.apps]
code = "Visual Studio Code"
